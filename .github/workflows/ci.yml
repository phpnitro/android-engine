name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build :engine (release AAR)
        run: ./gradlew :engine:assembleRelease --no-daemon

      - name: Lint :engine
        run: ./gradlew :engine:lintRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-release-aar
          path: engine/build/outputs/aar/*.aar
