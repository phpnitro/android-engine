name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build :engine (release AAR)
        run: ./gradlew :engine:assembleRelease --no-daemon

      # Non-blocking: a library module lints standalone, with no consuming
      # app around to merge in the permissions its manifest actually needs
      # (POST_NOTIFICATIONS, ACCESS_FINE_LOCATION...) — see this monorepo's
      # own android/app/src/main/AndroidManifest.xml, which is where those
      # are really declared. Lint's MissingPermission check has no way to
      # know that's coming, so it flags every permission-gated call here by
      # design, not by bug. Still runs so the report is visible, just
      # doesn't fail the build over expected findings.
      - name: Lint :engine
        run: ./gradlew :engine:lintRelease --no-daemon
        continue-on-error: true

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-release-aar
          path: engine/build/outputs/aar/*.aar
